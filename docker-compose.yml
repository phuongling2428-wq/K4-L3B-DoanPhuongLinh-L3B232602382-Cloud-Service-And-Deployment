# ═══════════════════════════════════════════════════════════════════
# CP2 + Bonus — Stack: nginx (LB) + agent (×N) + redis
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    # KHÔNG đặt container_name — để compose tự sinh tên khi scale
    restart: unless-stopped
    expose:
      - "8000" # chỉ mở trong mạng nội bộ, nginx proxy vào
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:?AGENT_API_KEY is required}
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import os,urllib.request,sys; sys.exit(0) if urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\"PORT\",\"8000\")}/health', timeout=3).status==200 else sys.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80" # nginx bind port 8000 ra host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  redis-data:
